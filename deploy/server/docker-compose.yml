# BuddyCore 小智服务端（xiaozhi-esp32-server）Docker 编排
#
# 由根目录 ./start-server.sh 调用，配置来自同目录的 .env（见 .env.example）。
# 结构与上游 main/xiaozhi-server/docker-compose_all.yml（xiaozhi-esp32-server
# 固定提交）一致，差异仅：镜像/端口/库名密码改为变量，智控台相关容器放进
# console profile，不再依赖上游安装脚本下载文件。
#
# 端口沿用上游默认：8000 设备 WebSocket、8003 服务端 HTTP（视觉分析/单服务 OTA）、
# 8002 智控台与 OTA 网关。云服务器放行这些端口即可（3306/6379 不对外暴露）。
#
# 所有目录都是相对路径（相对本文件），可把整个 deploy/server/ 搬到云服务器。

services:
  xiaozhi-esp32-server:
    # 设备接入与语音链路（ASR/LLM/TTS）主服务
    image: ${SERVER_IMAGE:-ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:server_latest}
    container_name: xiaozhi-esp32-server
    restart: always
    networks:
      - default
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
        required: false
      xiaozhi-esp32-server-redis:
        condition: service_healthy
        required: false
    ports:
      - "${PORT_WS:-8000}:8000"
      - "${PORT_HTTP:-8003}:8003"
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/opt/xiaozhi-esp32-server/data
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
      # 唤醒词应答缓存（服务端会用当前 TTS 音色生成并缓存；预生成文件也放这里）
      - ./data/wakeup_words:/opt/xiaozhi-esp32-server/config/assets/wakeup_words
      # BuddyCore 补丁：让豆包 TTS 支持新版单一 API Key（X-Api-Key）鉴权。
      # 该文件由 ./start-server.sh 从 dependencies/patches/ 生成到 build/server-overrides/，
      # 上游镜像本身保持不动；没有这个文件时 Docker 会把它当目录，故请用脚本启动。
      - ../../build/server-overrides/core/providers/tts/huoshan_double_stream.py:/opt/xiaozhi-esp32-server/core/providers/tts/huoshan_double_stream.py:ro
      - ../../build/server-overrides/core/providers/asr/doubao_stream.py:/opt/xiaozhi-esp32-server/core/providers/asr/doubao_stream.py:ro
      # BuddyCore 补丁：唤醒词应答话术固定为「你好，我在呢！」（锁掉上游的随机刷新）
      - ../../build/server-overrides/core/handle/helloHandle.py:/opt/xiaozhi-esp32-server/core/handle/helloHandle.py:ro
      # BuddyCore 补丁：设备激活码白名单准入（WebSocket 握手 + OTA 下发两处拦截）
      # 激活码由配网界面写入设备 NVS，设备在两次握手里通过 Activation-Code 头上报
      - ../../build/server-overrides/core/connection.py:/opt/xiaozhi-esp32-server/core/connection.py:ro
      - ../../build/server-overrides/core/api/ota_handler.py:/opt/xiaozhi-esp32-server/core/api/ota_handler.py:ro
      - ./overrides/core/utils/activation_whitelist.py:/opt/xiaozhi-esp32-server/core/utils/activation_whitelist.py:ro
      # 激活码白名单：编辑后即时生效（服务端按 mtime 热加载）
      - ./data/activation_codes.txt:/opt/xiaozhi-esp32-server/data/activation_codes.txt:ro

  xiaozhi-esp32-server-web:
    # 智控台（manager-api + manager-web + OTA 网关），仅在设置 MANAGER_SECRET 时启动
    profiles:
      - console
    image: ${WEB_IMAGE:-ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:web_latest}
    container_name: xiaozhi-esp32-server-web
    restart: always
    networks:
      - default
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    ports:
      - "${PORT_CONSOLE:-8002}:8002"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://xiaozhi-esp32-server-db:3306/${MYSQL_DATABASE:-xiaozhi_esp32_server}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=${MYSQL_USER:-root}
      - SPRING_DATASOURCE_DRUID_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      - SPRING_DATA_REDIS_HOST=xiaozhi-esp32-server-redis
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=6379
    volumes:
      - ./uploadfile:/uploadfile

  xiaozhi-esp32-server-db:
    profiles:
      - console
    image: ${MYSQL_IMAGE:-mysql:latest}
    container_name: xiaozhi-esp32-server-db
    restart: always
    networks:
      - default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 45s
      interval: 10s
      retries: 10
    expose:
      - 3306
    volumes:
      - ./mysql/data:/var/lib/mysql
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-xiaozhi_esp32_server}
      - MYSQL_INITDB_ARGS=--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  xiaozhi-esp32-server-redis:
    profiles:
      - console
    image: ${REDIS_IMAGE:-redis:8.0}
    container_name: xiaozhi-esp32-server-redis
    restart: always
    networks:
      - default
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  default:
